name: build image

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      deployment-file:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            distucker/${{ inputs.app-name }}:${{ github.sha }}
            distucker/${{ inputs.app-name }}:latest

  update-deployment:
    if: ${{ inputs.deployment-file != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: agungardiyanta/UrlShorterDeployment
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
      - name: Update image tag
        run: |
          git config user.email "${{ secrets.email }}"
          git config user.name "${{ secrets.name }}"
          sed -i "s|image: distucker/${{ inputs.app-name }}:.*|image: distucker/${{ inputs.app-name }}:${{ github.sha }}|" "${{ inputs.deployment-file }}"
          git add "${{ inputs.deployment-file }}"
          git commit -m "Update ${{ inputs.app-name }} image tag"
          git push origin main
