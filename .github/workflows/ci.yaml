name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - base-url

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urlshorter
          POSTGRES_PASSWORD: urlshorter
          POSTGRES_DB: urlshorter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshorter -d urlshorter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://urlshorter:urlshorter@localhost:5432/urlshorter?sslmode=disable
          REDIS_ADDR: localhost:6379
          OTEL_EXPORTER_OTLP_ENDPOINT: localhost:4317

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
